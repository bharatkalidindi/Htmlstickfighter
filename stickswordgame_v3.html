<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stick Master - Dual Blade Symphony</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0a0608;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { display: block; background-color: #0a0608; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        #gameContainer { position: relative; }
        #gameContainer:fullscreen { display: flex; justify-content: center; align-items: center; background-color: black; }
        
        #instructions {
            position: absolute; top: 10px; width: 100%; color: rgba(245, 230, 211, 0.8);
            text-align: center; font-size: 1.2em; text-shadow: 2px 2px 4px #000;
            z-index: 10; pointer-events: none;
        }
        #levelSkipButton, #fullscreenBtn {
            position: absolute; top: 10px; z-index: 20;
            padding: 8px 12px; background: rgba(20, 12, 14, 0.8); color: #d4a574;
            border: 1px solid rgba(212, 165, 116, 0.3); border-radius: 2px;
            cursor: pointer; font-family: inherit; backdrop-filter: blur(4px);
        }
        #levelSkipButton { left: 10px; }
        #fullscreenBtn { right: 10px; }

        .touch-controls {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; display: none; justify-content: center; align-items: center;
            z-index: 100; padding: 0 30px; box-sizing: border-box;
        }
        .d-pad, .action-buttons, .god-buttons { display: flex; gap: 20px; align-items: center; }
        .touch-button {
            width: 90px; height: 90px; background-color: rgba(20, 12, 14, 0.6);
            color: #f5e6d3; border-radius: 50%; display: flex; justify-content: center;
            align-items: center; font-size: 24px; font-weight: bold;
            border: 1px solid rgba(212, 165, 116, 0.3); user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0); box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .action-buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .god-buttons { justify-content: center; width: 100%; gap: 50px; }
        .god-buttons .touch-button { width: 110px; height: 110px; font-size: 22px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="instructions"></div>
    <button id="levelSkipButton">Skip Level</button>
    <button id="fullscreenBtn">Fullscreen</button>
    
    <div class="touch-controls" id="touchControls">
        <div id="normalControls" style="width:100%; display:flex; justify-content:space-between; align-items:center;">
            <div class="d-pad">
                <div class="touch-button" id="btnLeft">⇦</div>
                <div class="touch-button" id="btnRight">⇨</div>
            </div>
            <div class="action-buttons-grid">
                <div class="touch-button" id="btnFlip" style="grid-column: 1; grid-row: 1;">↶</div>
                <div class="touch-button" id="btnDash" style="grid-column: 1; grid-row: 2;">DSH</div>
                <div class="touch-button" id="btnSlash" style="grid-column: 2; grid-row: 2;">SLH</div>
                <div class="touch-button" id="btnJump" style="grid-column: 2; grid-row: 1;">↑</div>
                <div class="touch-button" id="btnSpin" style="grid-column: 1; grid-row: 3;">SPN</div>
                <div class="touch-button" id="btnPound" style="display: none; grid-column: 1; grid-row: 2;">GP</div>
                <div class="touch-button" id="btnGrapple" style="display: none; grid-column: 2; grid-row: 2;">GRP</div>
                <div class="touch-button" id="btnGrenade" style="display: none; grid-column: 1; grid-row: 2;">GRN</div>
                <div class="touch-button" id="btnArrow" style="display: none; grid-column: 2; grid-row: 2;">ARW</div>
            </div>
        </div>
        <div id="godModeControls" style="width:100%; display:none; justify-content:center;">
            <div class="god-buttons">
                <div class="touch-button" id="btnShell">SHELL</div>
                <div class="touch-button" id="btnRain">RAIN</div>
                <div class="touch-button" id="btnMongoose">GOOSE</div>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    // --- SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('gameContainer');
    
    const gameWidth = 800;
    const gameHeight = 600;
    canvas.width = gameWidth;
    canvas.height = gameHeight;

    // --- AUDIO ENGINE ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, duration, type = 'sine', volume = 0.1, slideTo = null) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function playNoise(duration, volume = 0.1, filterFreq = 1000, type = 'lowpass') {
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = type; filter.frequency.value = filterFreq;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(); noise.stop(audioCtx.currentTime + duration);
    }
    const SFX = {
        jump: () => playTone(150, 0.2, 'square', 0.08, 400),
        land: () => playNoise(0.1, 0.1, 300),
        swoosh: () => playNoise(0.3, 0.12, 700, 'bandpass'),
        clash: () => { playNoise(0.2, 0.2, 3000, 'highpass'); playTone(800, 0.15, 'square', 0.1, 400); },
        shoot: () => playTone(800, 0.1, 'sawtooth', 0.06, 200),
        hit: () => { playNoise(0.15, 0.2, 800); playTone(100, 0.15, 'sawtooth', 0.08, 50); },
        powerUp: () => { playTone(523, 0.1, 'square', 0.1); setTimeout(() => playTone(659, 0.1, 'square', 0.1), 80); setTimeout(() => playTone(784, 0.2, 'square', 0.1), 160); },
        groundPound: () => { playTone(50, 0.4, 'sine', 0.2, 20); playNoise(0.3, 0.2, 200); },
        arrow: () => playNoise(0.2, 0.1, 3000, 'bandpass'),
        grenade: () => playTone(100, 0.1, 'sine', 0.1, 50),
        explosion: () => { playNoise(0.5, 0.3, 100); playTone(40, 0.5, 'sine', 0.15, 20); },
        lion: () => playTone(80, 0.5, 'sawtooth', 0.1, 120),
        heliCrash: () => { playNoise(0.8, 0.3, 500); playTone(100, 0.8, 'sawtooth', 0.1, 30); },
        levelComplete: () => { playTone(523, 0.15, 'triangle', 0.1); setTimeout(() => playTone(659, 0.15, 'triangle', 0.1), 150); setTimeout(() => playTone(784, 0.3, 'triangle', 0.1), 300); },
        death: () => { playTone(200, 1.5, 'sawtooth', 0.15, 50); playNoise(1.5, 0.1, 200); },
        qteSuccess: () => { playTone(880, 0.1, 'sine', 0.1); setTimeout(() => playTone(1108, 0.2, 'sine', 0.1), 80); },
        qteFail: () => { playTone(150, 0.3, 'sawtooth', 0.15, 50); playNoise(0.3, 0.1, 200); },
        thunder: () => { playNoise(1.0, 0.3, 1000); playTone(60, 1.0, 'sine', 0.2, 30); },
        rain: () => playNoise(0.5, 0.05, 4000, 'highpass'),
        fire: () => { playNoise(0.3, 0.1, 800); playTone(200, 0.3, 'sawtooth', 0.05, 100); },
        snake: () => playTone(300, 0.2, 'sawtooth', 0.05, 600),
        victory: () => { 
            playTone(523, 0.2, 'square', 0.1); setTimeout(() => playTone(659, 0.2, 'square', 0.1), 200);
            setTimeout(() => playTone(784, 0.2, 'square', 0.1), 400); setTimeout(() => playTone(1046, 0.5, 'square', 0.1), 600);
        }
    };
    Object.assign(SFX, {
        block: () => { playTone(1500, 0.07, 'square', 0.06, 1100); playNoise(0.08, 0.12, 5000, 'highpass'); },
        heavy: () => { playNoise(0.25, 0.25, 900); playTone(90, 0.25, 'sawtooth', 0.12, 40); },
        glint: () => playTone(2400, 0.08, 'sine', 0.035, 3200),
        roar: () => { playNoise(0.9, 0.18, 380); playTone(70, 0.9, 'sawtooth', 0.12, 140); },
        kick: () => { playNoise(0.15, 0.2, 600); playTone(140, 0.15, 'square', 0.08, 60); },
        whoosh: () => playNoise(0.18, 0.08, 1200, 'bandpass'),
    });

    // --- GAME CONSTANTS ---
    const GRAVITY = 0.6;
    const PLAYER_SPEED = 5;
    const JUMP_STRENGTH = 13;
    const LION_JUMP_STRENGTH = 15;
    const CHARACTER_WIDTH = 20;
    const CHARACTER_HEIGHT = 50;
    const SLASH_DAMAGE = 25;
    const POWER_SLASH_DAMAGE = 50;
    const SPIN_DAMAGE = 35;
    const DASH_DAMAGE = 40;
    const LION_DAMAGE = 14; 
    const GRENADE_DAMAGE = 60;
    const ARROW_DAMAGE = 40;
    const BULLET_DAMAGE = 15;
    const KNOCKBACK_X = 10;
    const KNOCKBACK_Y = 6;
    const POWERUP_DURATION = 420;
    const GROUND_POUND_COOLDOWN = 180;
    const DEATH_SEQUENCE_DURATION = 1080;
    const TEXT_PHASE_START = 360;
    const BOSS_BATTLE_ROUNDS = 7;
    const BOSS_BATTLE_CHANCES = 4;
    const QTE_TIMER_DURATION = 120;
    const COMBO_WINDOW = 22;          // frames after a slash in which the next slash continues the combo
    const PLAYER_HURT_IFRAMES = 45;   // frames of protection after the player is hit
    const STEP_MS = 1000 / 60;        // game logic always runs 60 steps a second, whatever the screen's refresh rate
    const MAX_ATTACKERS = 2;          // enemies take turns: at most this many attack at once
    const DEG = Math.PI / 180;

    // --- MATH & FX HELPERS ---
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const rand = (a, b) => a + Math.random() * (b - a);
    const TAU = Math.PI * 2;
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
    const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);

    // --- FX STATE ---
    let cameraShake = 0;
    let fxParticles = [];
    let fxShockwaves = [];
    let fxBloodSplats = [];
    let fxImpacts = [], fxTexts = [];
    function addText(x, y, text, color) { fxTexts.push({ x, y, text, color, life: 40 }); }
    // Glow is a cached sprite instead of a new radial gradient per particle: much cheaper on phones.
    const glowSprites = {};
    function glowSprite(color) {
        if (glowSprites[color]) return glowSprites[color];
        const c = document.createElement('canvas'); c.width = c.height = 32;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, color); grad.addColorStop(0.5, color); grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad; g.fillRect(0, 0, 32, 32);
        return (glowSprites[color] = c);
    }

    class Particle {
        constructor(x, y, opts = {}) {
            this.x = x; this.y = y;
            this.vx = opts.vx ?? rand(-1, 1);
            this.vy = opts.vy ?? rand(-1, 1);
            this.life = opts.life ?? 1;
            this.maxLife = this.life;
            this.size = opts.size ?? rand(1, 2.5);
            this.color = opts.color ?? '#ffffff';
            this.gravity = opts.gravity ?? 0;
            this.friction = opts.friction ?? 0.96;
            this.glow = opts.glow !== false;
            this.streak = opts.streak ?? true;
            this.coloredStreak = opts.coloredStreak ?? false;
        }
        update(dt) {
            this.x += this.vx * dt * 60;
            this.y += this.vy * dt * 60;
            this.vx *= this.friction;
            this.vy *= this.friction;
            this.vy += this.gravity * dt * 60;
            this.life -= dt;
        }
        draw(ctx) {
            const t = clamp(this.life / this.maxLife, 0, 1);
            const size = Math.max(0.1, this.size * (0.3 + t * 0.7));
            if (this.glow) {
                const r = Math.max(0.1, size * 4);
                ctx.globalAlpha = t * 0.5;
                ctx.drawImage(glowSprite(this.color), this.x - r, this.y - r, r * 2, r * 2);
            }
            const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
            if (this.streak && speed > 0.6) {
                const tx = this.vx / speed;
                const ty = this.vy / speed;
                const sl = Math.min(size * 4, speed * 1.6);
                ctx.strokeStyle = this.coloredStreak ? this.color : 'rgba(255,255,255,' + t + ')';
                ctx.globalAlpha = t;
                ctx.lineWidth = Math.max(0.5, size * 0.6);
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.x - tx * sl, this.y - ty * sl);
                ctx.lineTo(this.x + tx * sl * 0.2, this.y + ty * sl * 0.2);
                ctx.stroke();
            } else {
                ctx.fillStyle = this.coloredStreak ? this.color : 'rgba(255,255,255,' + t + ')';
                ctx.globalAlpha = t;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.3, size * 0.5), 0, TAU);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
    }

    class BloodSplat {
        constructor(x, y, opts = {}) {
            this.x = x; this.y = y;
            this.life = opts.life ?? rand(6, 12);
            this.maxLife = this.life;
            this.maxDripLength = opts.dripLength ?? rand(10, 30);
            this.droplets = [];
            this.drips = [];
            this.color = opts.color ?? '#5c0a0a';
            this.baseSize = opts.size ?? rand(6, 12);
            this.droplets.push({ dx: 0, dy: 0, r: this.baseSize, alpha: 1 });
            this.droplets.push({ dx: rand(-2, 2), dy: rand(-2, 2), r: this.baseSize * 0.6, alpha: 0.9, color: '#3d0606' });
            for (let i = 0; i < Math.floor(rand(4, 8)); i++) {
                const angle = rand(0, TAU);
                const dist = rand(this.baseSize * 0.7, this.baseSize * 2.5);
                this.droplets.push({ dx: Math.cos(angle) * dist, dy: Math.sin(angle) * dist, r: rand(1.5, this.baseSize * 0.3), alpha: rand(0.5, 0.95) });
            }
            for (let i = 0; i < Math.floor(rand(1, 3)); i++) {
                this.drips.push({ dx: rand(-this.baseSize * 0.4, this.baseSize * 0.4), startY: rand(-this.baseSize * 0.2, this.baseSize * 0.3), r: rand(1.2, 2.5) });
            }
        }
        update(dt) { this.life -= dt; }
        draw(ctx) {
            const lifeRatio = clamp(this.life / this.maxLife, 0, 1);
            const fadeAlpha = lifeRatio < 0.25 ? lifeRatio / 0.25 : 1;
            const ageRatio = 1 - lifeRatio;
            const dripGrowth = easeOutCubic(Math.min(ageRatio * 2.5, 1));
            ctx.save();
            ctx.translate(this.x, this.y);
            for (const d of this.droplets) {
                ctx.globalAlpha = d.alpha * fadeAlpha * 0.85;
                ctx.fillStyle = d.color || this.color;
                ctx.beginPath();
                ctx.arc(d.dx, d.dy, Math.max(0.5, d.r), 0, TAU);
                ctx.fill();
            }
            for (const drip of this.drips) {
                const dripLen = dripGrowth * this.maxDripLength;
                ctx.globalAlpha = fadeAlpha * 0.7;
                ctx.fillStyle = this.color;
                ctx.fillRect(drip.dx - drip.r * 0.5, drip.startY, Math.max(0.5, drip.r), Math.max(0.5, dripLen));
                ctx.beginPath();
                ctx.arc(drip.dx, drip.startY + dripLen, Math.max(0.5, drip.r * 1.1), 0, TAU);
                ctx.fill();
            }
            ctx.restore();
            ctx.globalAlpha = 1;
        }
    }

    function spawnSparks(x, y, count, color = '#ffd966') {
        for (let i = 0; i < count; i++) {
            const a = rand(0, TAU);
            const s = rand(2, 9);
            fxParticles.push(new Particle(x, y, {
                vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(0, 1.5),
                life: rand(0.4, 1.2), size: rand(0.8, 2.2),
                color, gravity: 0.18, friction: 0.93,
            }));
        }
    }
    function spawnBlood(x, y, count, direction) {
        const colors = ['#8b0000', '#a31515', '#c41e3a', '#dc143c', '#7a1010'];
        const splatColors = ['#4a0a0a', '#5c0a0a', '#6b0f0f', '#3d0606'];
        for (let i = 0; i < count; i++) {
            let angle = direction !== undefined ? direction + rand(-0.7, 0.7) : rand(0, TAU);
            const speed = rand(3, 10);
            fxParticles.push(new Particle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - rand(0, 3),
                life: rand(0.6, 1.6),
                size: rand(1.5, 4),
                color: colors[Math.floor(rand(0, colors.length))],
                gravity: 0.35,
                friction: 0.97,
                streak: true,
                glow: false,
                coloredStreak: true,
            }));
        }
        fxBloodSplats.push(new BloodSplat(x, y, {
            size: rand(6, 12 + count * 0.2),
            life: rand(6, 12),
            dripLength: rand(15, 35),
            color: splatColors[Math.floor(rand(0, splatColors.length))],
        }));
        if (fxBloodSplats.length > 40) fxBloodSplats.splice(0, fxBloodSplats.length - 40);
    }
    function shake(amount) { cameraShake = Math.max(cameraShake, amount); }

    // --- ANT GRAPHICS SETUP ---
    const antCanvas = document.createElement('canvas');
    antCanvas.width = 8; antCanvas.height = 6;
    const actx = antCanvas.getContext('2d');
    actx.fillStyle = '#111';
    actx.beginPath(); actx.arc(2, 3, 1.5, 0, Math.PI*2); actx.arc(5, 3, 2, 0, Math.PI*2); actx.fill();
    actx.strokeStyle = '#111'; actx.lineWidth = 1;
    actx.beginPath();
    actx.moveTo(3, 1); actx.lineTo(4, 0); actx.moveTo(3, 5); actx.lineTo(4, 6);
    actx.moveTo(4, 2); actx.lineTo(5, 1); actx.moveTo(4, 4); actx.lineTo(5, 5);
    actx.stroke();

    // --- GAME STATE ---
    let player;
    let enemies = [], helicopters = [], lions = [], platforms = [];
    let bullets = [], projectiles = [], dustParticles = [];
    let grapplingRope = null;
    let keys = {};
    let gameOver = false, gameOverMessage = '';
    let currentLevel = 1, levelTransitioning = false, globalTimer = 0, playerLives = 2;
    let keySequence = [];
    let lionsHaveSpawned = false, lionsSpawnedCount = 0;
    let bump = null;
    let ants = [], giantAnts = []; 
    let isPlayerBeingEaten = false, deathSequenceTimer = 0;
    let playerDeathPos = { x: 0, y: 0 };
    let powerUp = null, nextPowerUpSpawnTimer = 300;
    const powerUpSpawnLocations = [ { x: 400, y: 180 }, { x: 175, y: 300 }, { x: 625, y: 300 }, { x: 400, y: 430 }];
    let boss, bossEffects = [], bossBattleState = 'intro', currentBossAttack = null;
    let playerAction = null, qteTimer = 0, roundNumber = 1;
    let playerChances = BOSS_BATTLE_CHANCES, battleResultText = '';
    let successfulRounds = 0, godModeVictoryActive = false, godModeVictoryTimer = 0;
    let freezeVictoryAnimation = false;
    let isTouchDevice = false;
    let scale = 1;
    let justPressed = {};                       // keys pressed since the last game step (for taps and combos)
    let hitStopFrames = 0, slowMo = 0, simFrame = 0;
    let corpses = [], lionCorpses = [];         // fallen fighters play out their fall, then fade
    let attackTokens = new Set();
    let lastPlayerKill = null, pendingReplay = null, levelEnding = false, replayedUpTo = 0;   // replayedUpTo: kills up to this frame already had a kill-cam
    let replayBuffer = [], frameEvents = [];    // the last seconds of the fight, for the 3D replay
    let nextEntityId = 1;
    const pressed = code => !!justPressed[code];
    function hitStop(frames) { hitStopFrames = Math.max(hitStopFrames, frames); }
    const HASH = new URLSearchParams(location.hash.slice(1));

    const levelInstructions = {
        1: "Dual Swords! Slash [F], Spin [G], Dash [H], Flip [Shift]",
        2: "Tougher foes! Your blade ignites with power.",
        3: "Gun & Sword! Power-up shoots bullets when slashing.",
        4: "Ground Pound [S] unlocked! Enemies go flying.",
        5: "Helicopters! Power-up grants Grapple [R].",
        6: "Lions! Power-up: Grenade [G] or Arrow [F] on tree.",
        7: "The path seems clear...",
        8: "GOD MODE! Counter the attacks!"
    };

    // --- SKELETAL ANIMATION HELPERS ---
    function getPoint(start, angleDeg, length) {
        const rad = angleDeg * Math.PI / 180;
        return { x: start.x + Math.cos(rad) * length, y: start.y + Math.sin(rad) * length };
    }
    function lerpPose(p1, p2, t) {
        let res = {}; for(let k in p1) res[k] = lerp(p1[k], p2[k], t); return res;
    }

    // --- POSE DEFINITIONS ---
    const POSE_IDLE = { hipX: 0, hipY: 0, hipAngle: 90, spineAngle: -85, headAngle: 90, L_Arm_U: -30, L_Arm_L: -20, R_Arm_U: 30, R_Arm_L: 20, L_Leg_U: 100, L_Leg_L: -15, R_Leg_U: 80, R_Leg_L: 15 };
    const POSE_RUN_1 = { ...POSE_IDLE, L_Leg_U: 45, L_Leg_L: 30, R_Leg_U: 135, R_Leg_L: -10, L_Arm_U: 45, R_Arm_U: -45, spineAngle: -75 };
    const POSE_RUN_2 = { ...POSE_IDLE, L_Leg_U: 135, L_Leg_L: -10, R_Leg_U: 45, R_Leg_L: 30, L_Arm_U: -45, R_Arm_U: 45, spineAngle: -75 };

    // Blade sweep per combo stage, in turns of π: right blade from→to, left blade from→to.

    // --- LEVEL 9: SOUL DUEL (one on one with the Devil Soul) ---
    let devil = null, devilShots = [], pillars = [], snakes = [], bolts = [], rainT = 0, gameWon = false;

    levelInstructions[9] = "Soul Duel! Thunder [G], Snakes [H], Rain [Shift]";
    function setupLevel9() {

    function devilHurt(d, dmg, dir, quiet) {

    function castThunder() {
        powerCd.thunder = POWER_CD.thunder; castPose();
        const tx = devil.x + devil.width / 2 + rand(-6, 6), ty = devil.y + devil.height / 2;
        const points = []; let x = tx + rand(-60, 60), y = 0;
        points.push({ x, y });
        while (y < ty - 20) { x += (tx - x) * 0.25 + rand(-22, 22); y += rand(30, 55); points.push({ x, y }); }
        points.push({ x: tx, y: ty });
        bolts.push({ points, life: 26 });
        // a second, thinner fork
        const f = points[Math.floor(points.length / 2)], fork = [f];
        let fx = f.x, fy = f.y; for (let i = 0; i < 3; i++) { fx += rand(-40, 40); fy += rand(25, 45); fork.push({ x: fx, y: fy }); }
        bolts.push({ points: fork, life: 18, thin: true });
        if (devilAlive()) { devilHurt(devil, 45, Math.sign(tx - player.x) || 1); devil.stun = 50; if (devil.state === 'claw' || devil.state === 'windup') devil.state = 'float'; }
        spawnSparks(tx, ty, 40, '#e0f2fe'); spawnSparks(tx, ty, 20, '#fde047');

    function castSnakes() {

    function devilFire(n, spread, speed) {
        const cx = devil.x + devil.width / 2, cy = devil.y + 24;
        const a0 = Math.atan2(player.y + 25 - cy, player.x + player.width / 2 - cx);
        for (let i = 0; i < n; i++) {
            const a = n === 1 ? a0 : (spread >= TAU ? i / n * TAU : a0 - spread / 2 + spread * i / (n - 1));
            devilShots.push({ x: cx, y: cy, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 220 });
        }
        SFX.fire();
    }

    function updateLevel9() {
        for (const k in powerCd) if (powerCd[k] > 0) powerCd[k]--;
        const d = devil;
        if (d) updateDevil(d);

        // Holy rain: heals the player, burns the devil, puts out fireballs
        if (rainT > 0) {
            rainT--;
            if (rainT % 30 === 0) SFX.rain();
            if (player.health > 0) player.health = Math.min(100, player.health + 0.12);
            if (devilAlive() && rainT % 8 === 0) { devilHurt(d, 1, 0, true); if (rainT % 32 === 0) addText(d.x + 22 + rand(-10, 10), d.y - 6, '1', '#93c5fd'); }
        }
        devilShots = devilShots.filter(s => {
            s.x += s.vx; s.y += s.vy; s.life--;
            if (rainT > 0 && Math.random() < 0.06) { spawnSparks(s.x, s.y, 6, '#cbd5e1'); return false; }   // fizzles in the rain
            if (Math.hypot(s.x - (player.x + player.width / 2), s.y - (player.y + 25)) < 16) {
                damageTarget(d, player, 8, { dir: Math.sign(s.vx) || 1, quiet: true });
                spawnSparks(s.x, s.y, 10, '#fb923c'); return false;
            }
            if (s.y > 580 || s.x < -20 || s.x > 820 || s.y < -20 || s.life <= 0) { spawnSparks(s.x, Math.min(s.y, 578), 6, '#fb923c'); return false; }
            return true;
        });
        pillars = pillars.filter(p => {
            p.t++;
            if (p.t === 50) { SFX.explosion(); shake(8); spawnSparks(p.x, 575, 20, '#fb923c'); }
            if (p.t > 50 && p.t < 75 && !p.hit && Math.abs(player.x + player.width / 2 - p.x) < 26 && player.y + player.height > 540) {
                p.hit = true; damageTarget(d, player, 20, { dir: Math.sign(player.x - p.x) || 1, knockdown: true, kx: (Math.sign(player.x - p.x) || 1) * 3, ky: 12, quiet: true });
            }
            return p.t < 82;
        });
        // Snakes: leap off the hand, then home in on the devil, weaving
        snakes = snakes.filter(s => {
            s.life--;
            s.trail.unshift({ x: s.x, y: s.y }); if (s.trail.length > 12) s.trail.pop();
            if (devilAlive()) {
                const tx = d.x + d.width / 2, ty = d.y + d.height / 2;
                const a = Math.atan2(ty - s.y, tx - s.x), sp = 6;
                s.vx = lerp(s.vx, Math.cos(a) * sp, 0.08); s.vy = lerp(s.vy, Math.sin(a) * sp, 0.08);
                if (Math.hypot(tx - s.x, ty - s.y) < 26) {
                    damageTarget(player, d, 14, { dir: Math.sign(s.vx) || 1, quiet: true, hx: s.x, hy: s.y });
                    d.poison = 150; SFX.snake(); spawnSparks(s.x, s.y, 12, '#4ade80');
                    return false;
                }
            } else s.vy += 0.3;
            const w = Math.sin(globalTimer * 0.4 + s.ph) * 2.2;
            s.x += s.vx - s.vy / 6 * w; s.y += s.vy + s.vx / 6 * w;
            return s.life > 0 && s.y < 620;
        });
        bolts = bolts.filter(b => --b.life > 0);

    function updateDevil(d) {
        if (d.flash > 0) d.flash--;
        d.hover += 0.05;
        const px = player.x + player.width / 2, py = player.y + player.height / 2;
        const cx = d.x + d.width / 2, cy = d.y + d.height / 2;
        const phase = d.health > 400 ? 1 : d.health > 200 ? 2 : 3;
        if (d.state === 'dead') {
            d.deathT++; d.vy -= 0.03; d.y += d.vy; d.vx *= 0.9; d.x += d.vx;
            d.alpha = Math.max(0, 1 - d.deathT / 110);
            if (d.deathT % 3 === 0) spawnSparks(cx + rand(-20, 20), cy + rand(-30, 30), 3, Math.random() < 0.5 ? '#c026d3' : '#f43f5e');
            return;
        }
        if (d.poison > 0) { d.poison--; if (d.poison % 10 === 0) { devilHurt(d, 1, 0, true); spawnSparks(cx + rand(-14, 14), cy + rand(-20, 20), 2, '#4ade80'); } }
        if (d.stun > 0) { d.stun--; d.vx *= 0.9; d.vy = Math.sin(d.hover * 4) * 0.4; d.x += d.vx; d.y += d.vy; return; }
        const slow = rainT > 0 ? 0.6 : 1;
        d.t--;
        const toward = Math.sign(px - cx) || d.direction;
        switch (d.state) {
        case 'intro':
            d.vx = 0; d.vy = Math.sin(d.hover * 2) * 0.5;
            if (d.t === 110) { SFX.roar(); SFX.thunder(); shake(10); cam3D(d.id, 3000, 'THE DEVIL SOUL', false, 'BOSS'); }
            if (d.t <= 0) { d.state = 'float'; d.atkCd = 50; }
            break;
        case 'float': {
            d.direction = toward;
            const side = Math.sign(cx - px) || 1;
            const tx = clamp(px + side * 170, 40, 760), ty = clamp(py - 70, 110, 470);
            d.vx = lerp(d.vx, (tx - cx) * 0.03 * slow, 0.1);
            d.vy = lerp(d.vy, ((ty - cy) * 0.03 + Math.sin(d.hover * 2) * 0.8) * slow, 0.1);
            if (--d.atkCd <= 0) {
                const moves = ['claw', 'fire'];
                if (phase >= 2) moves.push('pillars');
                if (phase >= 3) moves.push('storm');
                d.next = moves[Math.floor(Math.random() * moves.length)];
                d.state = 'windup'; d.t = phase === 3 ? 26 : 38; SFX.glint();
            }
            break;
        }
        case 'windup':
            d.vx *= 0.85; d.vy *= 0.85; d.direction = toward;
            if (d.t <= 0) {
                if (d.next === 'claw') { d.state = 'claw'; d.t = 40; d.vx = toward * 13; d.vy = clamp((py - cy) * 0.06, -4, 4); d.hitDone = false; SFX.whoosh(); }
                else {
                    if (d.next === 'fire') devilFire(phase === 3 ? 5 : 3, 0.5, 5.5);
                    else if (d.next === 'storm') devilFire(10, TAU, 4.5);
                    else { SFX.fire(); for (const off of [0, -120, 120]) pillars.push({ x: clamp(px + off, 20, 780), t: 0, hit: false }); }
                    d.state = 'float'; d.atkCd = (phase === 3 ? 55 : 80) + rand(0, 30);
                }
            }
            break;
        case 'claw':
            if (!d.hitDone && player.health > 0 && overlap(d, player)) {
                d.hitDone = true;
                damageTarget(d, player, 16, { dir: Math.sign(d.vx) || 1, knockdown: true, kx: Math.sign(d.vx) * 8, ky: 7, quiet: true });
            }
            if (d.t % 2 === 0) fxParticles.push(new Particle(cx, cy + rand(-20, 20), { vx: -d.vx * 0.2, vy: rand(-0.5, 0.5), life: 0.5, size: 3, color: '#c026d3', streak: false }));
            if (d.t <= 0 || d.x <= 0 || d.x + d.width >= gameWidth) { d.state = 'float'; d.vx *= 0.2; d.atkCd = 60 + rand(0, 30); }
            break;
        case 'stagger':
            d.vx *= 0.9; d.vy = lerp(d.vy, 1, 0.1);
            if (d.t <= 0) { d.state = 'float'; d.atkCd = 30; }
            break;
        }
        d.x += d.vx; d.y += d.vy;
        d.x = clamp(d.x, 0, gameWidth - d.width); d.y = clamp(d.y, 60, 580 - d.height - 4);
    }

    function drawHellSky() {
        const g = ctx.createLinearGradient(0, 0, 0, gameHeight);

        for (let i = 0; i < 40; i++) {

            ctx.globalAlpha = 0.25 + (i % 3) * 0.15; ctx.fillRect(x, y, 2, 2);
        }
        ctx.globalAlpha = 1;

    function drawDevil(d) {
        if (!d || d.alpha <= 0) return;
        const t = globalTimer, cx = d.x + d.width / 2, cy = d.y + d.height / 2 + Math.sin(d.hover * 2) * 3;
        const flash = d.flash > 0, wind = d.state === 'windup';
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const pulse = 1 + Math.sin(t / 8) * 0.08 + (wind ? 0.3 : 0);
        ctx.globalAlpha = 0.5 * d.alpha; ctx.drawImage(glowSprite('#a21caf'), cx - 90 * pulse, cy - 90 * pulse, 180 * pulse, 180 * pulse);
        ctx.globalAlpha = 0.35 * d.alpha; ctx.drawImage(glowSprite(d.poison > 0 ? '#22c55e' : '#f43f5e'), cx - 55, cy - 75, 110, 110);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = d.alpha;
        ctx.translate(cx, cy); ctx.scale(d.direction, 1);
        if (d.stun > 0) ctx.rotate(Math.sin(t / 3) * 0.08);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        // wispy robe
        ctx.fillStyle = flash ? '#ffffff' : '#2e1065'; ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-16, -20);
        ctx.quadraticCurveTo(-24, 10, -12 + Math.sin(t / 6) * 4, 40);
        ctx.quadraticCurveTo(-4, 30, Math.sin(t / 5) * 5, 50);
        ctx.quadraticCurveTo(6, 30, 12 + Math.sin(t / 7) * 4, 40);
        ctx.quadraticCurveTo(24, 10, 16, -20);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // arms and claws
        const arms = d.state === 'claw' ? [[14, -14, 32, -10, 50, -8], [-10, -14, 20, -4, 40, 2]]
                   : wind ? [[14, -16, 24, -36, 18, -54], [-14, -16, -24, -36, -18, -54]]
                   : [[14, -16, 24, 0, 20 + Math.sin(t / 9) * 3, 14], [-14, -16, -24, 0, -20 - Math.sin(t / 9) * 3, 14]];
        for (const a of arms) {
            ctx.strokeStyle = flash ? '#ffffff' : '#7e22ce'; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[2], a[3]); ctx.lineTo(a[4], a[5]); ctx.stroke();
            ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 1.5; ctx.beginPath();
            const ang = Math.atan2(a[5] - a[3], a[4] - a[2]);
            for (const k of [-0.5, 0, 0.5]) { ctx.moveTo(a[4], a[5]); ctx.lineTo(a[4] + Math.cos(ang + k) * 8, a[5] + Math.sin(ang + k) * 8); }
            ctx.stroke();
        }
        // head with horns
        ctx.fillStyle = flash ? '#ffffff' : '#7f1d1d'; ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2;

    function setupInput() {
        window.addEventListener('keydown', (e) => {
            initAudio(); Replay3D.load();
            if (['Space','KeyW','KeyS','KeyR','KeyG','KeyF','KeyQ','KeyE','KeyH'].includes(e.code)) { e.preventDefault(); }
            if (Replay3D.blocking()) { Replay3D.skip(); return; }
            if (!e.repeat) justPressed[e.code] = true;
            keys[e.code] = true; keySequence.push(e.key.toLowerCase());
            if (keySequence.length > 5) keySequence.shift();
            checkCheatCodes();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });
        window.addEventListener('blur', () => { keys = {}; });

        isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (isTouchDevice) {
            document.getElementById('touchControls').style.display = 'flex';
            document.getElementById('instructions').style.display = 'none';
            const buttonMap = { btnLeft: 'KeyA', btnRight: 'KeyD', btnJump: 'KeyW', btnSlash: 'KeyF', btnSpin: 'KeyG', btnDash: 'KeyH', btnFlip: 'ShiftLeft', btnPound: 'KeyS', btnGrapple: 'KeyR', btnGrenade: 'KeyG', btnArrow: 'KeyF', btnShell: 'KeyQ', btnRain: 'KeyW', btnMongoose: 'KeyE' };
            for (const [btnId, keyCode] of Object.entries(buttonMap)) {
                const button = document.getElementById(btnId);
                if (!button) continue;
                const press = (e) => {
                    e.preventDefault(); initAudio(); Replay3D.load();
                    if (Replay3D.blocking()) { Replay3D.skip(); return; }
                    if (!keys[keyCode]) justPressed[keyCode] = true;
                    keys[keyCode] = true;
                };
                const release = (e) => { e.preventDefault(); keys[keyCode] = false; };
                button.addEventListener('touchstart', press, { passive: false });
                button.addEventListener('touchend', release, { passive: false });
                button.addEventListener('touchcancel', release, { passive: false });
            }
        }
        canvas.addEventListener('click', () => { if (gameOver) { keys['KeyR'] = true; setTimeout(() => keys['KeyR'] = false, 100); }});

        });

    // --- DRAWING FUNCTIONS ---
    // --- SKELETAL ANIMATION ---
    // Every game step each fighter gets a pose, then joints in world space:
    // J = [hip, neck, head, lShoulder, lElbow, lHand, rShoulder, rElbow, rHand, lHip, lKnee, lFoot, rHip, rKnee, rFoot] as x,y pairs.
    // The 2D drawing, the hit boxes of the blades and the 3D replay all read the same joints.
    function lerpAngle(a, b, t) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return a + d * t; }
    const SWORD_LEN = 35;

    function animateCharacter(c) {
        const dir = c.direction;
        let target = POSE_IDLE, blend = 0.35, rot = 0, lie = 0, snapRot = false;
        let sR = -0.25, sL = 0.25;                       // blade angles in turns of π, as if facing right
        const kd = c.kd;
        let p = 0;
        if (c.pinnedBy) {
            target = POSE_PINNED; blend = 0.4; lie = 1; rot = -dir * Math.PI / 2; sR = 0.55; sL = 0.4;
        } else if (kd) {
            sR = 0.6; sL = 0.42;
            if (kd.phase === 'air') { target = POSE_TUMBLE; blend = 0.3; c.spinRot += (c.spinDir || -dir) * 0.16; rot = c.spinRot; snapRot = true; }
            else if (kd.phase === 'down') { target = POSE_DOWN; blend = 0.25; lie = 1; rot = -dir * Math.PI / 2; }
            else { const k = easeOutCubic(clamp(kd.t / 20, 0, 1)); target = POSE_GETUP; blend = 0.35; lie = 1 - k; rot = -dir * Math.PI / 2 * (1 - k); }
        } else if (c.hitstun > 0) {
            target = POSE_FLINCH; blend = 0.6; sR = 0.45; sL = 0.3;
        } else if (c.castT > 0) {
            target = POSE_CAST; blend = 0.5; sR = -0.45; sL = -0.62;
        } else if (c.blockTimer > 0) {
            target = POSE_BLOCK; blend = 0.6; sR = -0.42; sL = -0.6;
        } else if (c.isDashing) {
            target = POSE_DASH; blend = 0.8; sR = 0.02; sL = 0.93;
        } else if (c.isSpinning) {
            target = POSE_SPIN; blend = 0.8; c.spinRot += 0.8 * dir; rot = c.spinRot; snapRot = true; sR = 0; sL = 1;
        } else if (c.isSlashing) {
            p = 1 - c.slashCooldown / c.slashDur;
            const [chamber, strike] = SLASH_POSES[c.comboStage || 1];
            if (p < 0.22) { target = chamber; blend = 0.5; }          // anticipation
            else if (p < 0.6) { target = strike; blend = 0.85; }      // strike
            else { target = strike; blend = 0.08; }                   // hold the follow-through
            const arc = SWORD_ARCS[c.comboStage || 1];
            const k = easeOutExpo(clamp((p - 0.18) / 0.42, 0, 1));
            sR = lerp(arc[0], arc[1], k); sL = lerp(arc[2], arc[3], k);
        } else if (c.windup > 0) {
            target = POSE_SLASH_CHAMBER; blend = 0.2; sR = -0.85; sL = 0.7;
        } else if (c.isFlipping) {
            target = POSE_DJUMP; blend = 0.5; rot = -dir * (1 - c.flipCooldown / 45) * TAU; snapRot = true;   // a real backflip
        } else if (!c.onGround) {
            if (c.djump > 0) { target = POSE_DJUMP; blend = 0.5; rot = dir * easeOutCubic(1 - c.djump / 30) * TAU; snapRot = true; }
            else if (c.vy < 1) target = POSE_JUMP;
            else { target = POSE_FALL; blend = 0.15; }
        } else if (Math.abs(c.vx) > 1) {
            c.runPhase += Math.abs(c.vx) * 0.075;
            const s = (Math.sin(c.runPhase) + 1) / 2;
            target = lerpPose(POSE_RUN_1, POSE_RUN_2, s);
            target.hipY = 1 - Math.abs(Math.cos(c.runPhase)) * 3;
            blend = 0.5; sR = -0.12; sL = 0.5;
        } else {
            const near = c.isPlayer
                ? enemies.some(e => Math.abs(e.x - c.x) < 130 && Math.abs(e.y - c.y) < 60) || lions.some(l => Math.abs(l.x + 30 - c.x) < 150)
                : true;
            const base = near ? POSE_GUARD : POSE_IDLE;
            const b = Math.sin((globalTimer + c.seed * 10) / 22);   // breathing
            target = { ...base, hipY: base.hipY + b * 0.8, spineAngle: base.spineAngle + b * 2, R_Arm_U: base.R_Arm_U + b * 4, L_Arm_U: base.L_Arm_U - b * 4 };
            blend = 0.2;
            if (near) { sR = -0.1 + b * 0.02; sL = 0.62; } else { sR = -0.25 + b * 0.02; sL = 0.25 - b * 0.02; }
        }
        if (c.land > 0 && c.onGround && !kd) target = { ...target, hipY: target.hipY + c.land * 0.8 };   // landing squash

        c.pose = lerpPose(c.pose, target, blend);
        c.renderRot = snapRot ? rot : lerpAngle(c.renderRot, rot, 0.3);
        if (!snapRot) c.spinRot = c.renderRot;
        c.lie = lerp(c.lie || 0, lie, 0.25);

        const P = c.pose;
        const rx = c.x + c.width / 2, ry = lerp(c.y + 15, c.y + c.height - 4, c.lie);
        const cs = Math.cos(c.renderRot), sn = Math.sin(c.renderRot);
        const J = c.J || (c.J = new Array(30));
        let n = 0;
        const put = (q) => { const lx = q.x * dir; J[n++] = rx + lx * cs - q.y * sn; J[n++] = ry + lx * sn + q.y * cs; };
        const hip = { x: P.hipX, y: P.hipY + 8 };
        const neck = getPoint(hip, P.spineAngle, 20);
        const head = getPoint(neck, P.headAngle, 8);
        const lS = getPoint(neck, P.spineAngle - 90, 6), lE = getPoint(lS, P.L_Arm_U, 14), lH = getPoint(lE, P.L_Arm_U + P.L_Arm_L, 14);
        const rS = getPoint(neck, P.spineAngle + 90, 6), rE = getPoint(rS, P.R_Arm_U, 14), rH = getPoint(rE, P.R_Arm_U + P.R_Arm_L, 14);
        const lHp = getPoint(hip, P.hipAngle - 90, 4), lK = getPoint(lHp, P.L_Leg_U, 18), lF = getPoint(lK, P.L_Leg_U + P.L_Leg_L, 18);
        const rHp = getPoint(hip, P.hipAngle + 90, 4), rK = getPoint(rHp, P.R_Leg_U, 18), rF = getPoint(rK, P.R_Leg_U + P.R_Leg_L, 18);
        [hip, neck, head, lS, lE, lH, rS, rE, rH, lHp, lK, lF, rHp, rK, rF].forEach(put);

        const aR = world(sR), aL = world(sL);
        c.handR.x = J[16]; c.handR.y = J[17]; c.handL.x = J[10]; c.handL.y = J[11];

        pushTrail(c.swordTrailL, c.handL, c.tipL);

        // Onion-skin ghosts of fast moves

    function drawSwordTrail(character, trail) {
        if (trail.length < 3) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const cColor = character.isPoweredUp ? '#00ffff' : (character.isPlayer ? '#f1f5f9' : '#ef4444');
        const cGlow = character.isPoweredUp ? '#80ffea' : '#ffffff';
        // Anime smear: a filled band between the tip and the middle of the blade
        ctx.fillStyle = cColor;
        for (let i = 1; i < trail.length; i++) {
            const a = trail[i - 1], b = trail[i];
            ctx.globalAlpha = 0.2 * (1 - i / trail.length);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.mx, b.my); ctx.lineTo(a.mx, a.my); ctx.closePath(); ctx.fill();
        }
        const passes = [
            { width: 16, alpha: 0.1, color: cGlow },
            { width: 8, alpha: 0.3, color: cColor },
            { width: 3, alpha: 0.9, color: '#ffffff' }
        ];
        for (const pass of passes) {
            ctx.strokeStyle = pass.color;
            ctx.lineWidth = pass.width;
            for (let i = 1; i < trail.length; i++) {
                ctx.globalAlpha = pass.alpha * (1 - i / trail.length);
                ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
            }
        }
        ctx.restore();
    }

    function drawFigure(J, color, alpha, solid) {
        ctx.save();
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
        const seg = (...idx) => { ctx.moveTo(J[idx[0]*2], J[idx[0]*2+1]); for (let i = 1; i < idx.length; i++) ctx.lineTo(J[idx[i]*2], J[idx[i]*2+1]); };

        ctx.beginPath(); seg(3, 4, 5); seg(9, 10, 11); ctx.stroke();
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 3.5; ctx.beginPath(); seg(0, 1); ctx.stroke();
        ctx.lineWidth = 3; ctx.beginPath(); seg(6, 7, 8); seg(12, 13, 14); ctx.stroke();
        ctx.beginPath(); ctx.arc(J[4], J[5], 8, 0, TAU); ctx.fill();

    }

    function drawBlade(h, t, powered) {

        ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(t.x, t.y); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(t.x, t.y); ctx.stroke();
        // Cross-guard
        const dx = (t.x - h.x) / SWORD_LEN, dy = (t.y - h.y) / SWORD_LEN;
        const gx = h.x + dx * 4, gy = h.y + dy * 4;
        ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(gx - dy * 4, gy + dx * 4); ctx.lineTo(gx + dy * 4, gy - dx * 4); ctx.stroke();
    }

    function drawStickman(c, alpha = 1) {
        if (!c.J) return;
        const color = c.isPoweredUp ? '#00ffff' : (c.isPlayer ? '#f1f5f9' : '#ef4444');
        const flicker = c.isPlayer && !c.corpse && c.hurtTimer > 0 && (globalTimer >> 2) % 2 ? 0.45 : 1;
        const a = alpha * (c.alpha ?? 1) * flicker;
        if (a <= 0) return;
        const x = c.x + c.width / 2;

        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath(); ctx.ellipse(x, c.y + c.height + 1, c.lie > 0.5 ? 22 : 10, 3, 0, 0, TAU); ctx.fill();

            ctx.fillStyle = 'rgba(239, 68, 68, 0.5)'; ctx.fillRect(x - 15, c.y - 12, 30, 4);
            ctx.fillStyle = '#22c55e'; ctx.fillRect(x - 15, c.y - 12, 30 * clamp(c.health / c.maxHealth, 0, 1), 4);
        }
        ctx.restore();

        const ghost = c.isPlayer ? 'rgba(241,245,249,0.3)' : 'rgba(239,68,68,0.3)';
        c.history.forEach((h, i) => drawFigure(h, ghost, (i + 1) / (c.history.length + 1) * 0.4 * a, false));

        drawSwordTrail(c, c.swordTrailR);

            ctx.save(); ctx.globalCompositeOperation = 'lighter';

            ctx.strokeStyle = '#fffbe6'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(g.x - s, g.y); ctx.lineTo(g.x + s, g.y); ctx.moveTo(g.x, g.y - s); ctx.lineTo(g.x, g.y + s); ctx.stroke();
            ctx.restore();
        }
    }

    // --- LION: shared skeleton for the 2D drawing and the 3D replay ---
    function ik2(ax, ay, fx, fy, l1, l2, bend) {
        let dx = fx - ax, dy = fy - ay, d = Math.hypot(dx, dy);
        const maxD = l1 + l2 - 0.01;
        if (d > maxD) { fx = ax + dx / d * maxD; fy = ay + dy / d * maxD; d = maxD; }
        d = Math.max(d, 0.01);
        const ang = Math.atan2(fy - ay, fx - ax) + bend * Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
        return { kx: ax + Math.cos(ang) * l1, ky: ay + Math.sin(ang) * l1, fx, fy };
    }
    // far front, near front, far hind, near hind
    const LION_LEGS = [{ front: 1, near: 0, off: 0 }, { front: 1, near: 1, off: Math.PI }, { front: 0, near: 0, off: Math.PI * 0.5 }, { front: 0, near: 1, off: Math.PI * 1.5 }];

    function lionPose(l) {
        const t = globalTimer + l.id * 13;
        const speed = Math.abs(l.vx);
        const dead = l.state === 'dead';
        const air = !l.onGround && l.state !== 'pin' && !dead;
        const cr = l.crouch;
        const swipe = l.state === 'swipe' ? Math.sin(clamp(l.swipeT, 0, 1) * Math.PI) : 0;
        const bob = speed > 0.3 && !air ? Math.sin(l.gait * 2) * 1.2 : Math.sin(t / 14) * 0.6;
        const sh = { x: 15, y: dead ? 7 : -3 + cr * 6 + bob - swipe * 5 };
        const hp = { x: -15, y: dead ? 7 : -4 + cr * 5 - bob * 0.5 };
        let head = { x: 27, y: -7 + cr * 6 + bob * 1.3 - swipe * 4 };
        if (l.state === 'roar') head = { x: 28, y: -11 };
        if (l.state === 'pin') head = { x: 25, y: 5 + Math.sin(t / 4) * 2 };
        if (dead) head = { x: 28, y: 9 };
        const gallop = speed > 3;
        const stride = clamp(speed * 3.2, 0, 11), lift = clamp(speed * 2.2, 0, 7);
        const legs = LION_LEGS.map(L => {
            const a = L.front ? sh : hp;
            const ax = a.x + (L.near ? 1.5 : -1.5), ay = a.y + 3;
            const off = gallop ? (L.front ? (L.near ? 0.35 : 0) : (L.near ? Math.PI + 0.35 : Math.PI)) : L.off;
            const ph = l.gait + off;
            let fx = ax + Math.cos(ph) * stride, fy = 15 - Math.max(0, Math.sin(ph)) * lift;
            if (air) {
                if (l.state === 'pounce') { fx = ax + (L.front ? 18 : -16); fy = L.front ? 4 : 10; }
                else { fx = ax + (L.front ? 9 : -5); fy = 11; }
            }
            if (L.front && L.near && swipe > 0) { fx = ax + 6 + 16 * swipe; fy = 15 - 24 * swipe; }
            if (l.state === 'pin' && L.front) { fx = ax + 10; fy = 15; }
            if (dead) { fx = ax + (L.front ? 15 : -13) + (L.near ? 2 : -2); fy = 13; }
            const k = ik2(ax, ay, fx, fy, 10, 10, L.front ? 1 : -1);
            return { ax, ay, kx: k.kx, ky: k.ky, fx: k.fx, fy: k.fy, near: L.near, front: L.front };
        });
        const tailUp = (l.state === 'roar' || l.state === 'pounce' || l.state === 'crouch') ? 1 : 0;
        const sw = dead ? 0 : Math.sin(t / 9);
        const tb = { x: hp.x - 13, y: hp.y - 3 };
        const t1 = { x: tb.x - 9, y: tb.y - 2 - tailUp * 6 + sw * 3 + (dead ? 8 : 0) };
        const t2 = { x: t1.x - 7 - sw * 2, y: t1.y - 5 - tailUp * 4 + (dead ? 9 : Math.sin(t / 9 + 1.2) * 4) };
        l.sk = { sh, hp, head, legs, tail: [tb, t1, t2] };

        // World-space copy for the replay recorder
        const cx = l.x + l.width / 2, cy = l.y + l.height / 2, d = l.direction;
        const W = l.skW || (l.skW = new Array(36));
        let n = 0;
        const put = q => { W[n++] = cx + q.x * d; W[n++] = cy + q.y; };
        put(sh); put(hp); put(head);
        legs.forEach(g => { put({ x: g.ax, y: g.ay }); put({ x: g.kx, y: g.ky }); put({ x: g.fx, y: g.fy }); });
        l.sk.tail.forEach(put);
    }

    function drawLion(l) {
        const sk = l.sk; if (!sk) return;
        const cx = l.x + l.width / 2, cy = l.y + l.height / 2;
        const flash = l.flash > 0;
        ctx.save();
        ctx.globalAlpha = l.alpha ?? 1;
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(cx, l.y + l.height + 2, 25, 4, 0, 0, TAU); ctx.fill();
        ctx.translate(cx, cy); ctx.scale(l.direction, 1);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const leg = (g, col, w) => {
            ctx.strokeStyle = col; ctx.lineWidth = w;
            ctx.beginPath(); ctx.moveTo(g.ax, g.ay); ctx.lineTo(g.kx, g.ky); ctx.lineTo(g.fx, g.fy); ctx.stroke();
            ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(g.fx + 1.5, g.fy - 0.5, 3.2, 2.2, 0, 0, TAU); ctx.fill();
        };
        sk.legs.forEach(g => { if (!g.near) leg(g, flash ? '#e5e5e5' : '#24140a', 5); });

        const [tb, t1, t2] = sk.tail;
        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(tb.x, tb.y); ctx.quadraticCurveTo(t1.x, t1.y, t2.x, t2.y); ctx.stroke();
        ctx.fillStyle = '#3a2210'; ctx.beginPath(); ctx.arc(t2.x, t2.y, 3, 0, TAU); ctx.fill();

        const { sh, hp } = sk;
        ctx.fillStyle = flash ? '#ffffff' : '#7c2d12'; ctx.strokeStyle = '#3a2210'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(hp.x - 12, hp.y + 2);
        ctx.bezierCurveTo(hp.x - 14, hp.y - 12, sh.x - 4, sh.y - 14, sh.x + 8, sh.y - 6);
        ctx.bezierCurveTo(sh.x + 12, sh.y + 2, sh.x + 6, sh.y + 10, sh.x - 2, sh.y + 9);
        ctx.bezierCurveTo(sh.x - 12, sh.y + 12, hp.x + 6, hp.y + 11, hp.x - 4, hp.y + 9);
        ctx.quadraticCurveTo(hp.x - 13, hp.y + 8, hp.x - 12, hp.y + 2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        if (!flash) {
            ctx.fillStyle = 'rgba(217, 119, 6, 0.35)';
            ctx.beginPath(); ctx.ellipse((sh.x + hp.x) / 2, (sh.y + hp.y) / 2 + 6, 14, 3.5, 0, 0, TAU); ctx.fill();
        }
        sk.legs.forEach(g => { if (g.near) leg(g, flash ? '#ffffff' : '#3a2210', 5.5); });

        const hx = sk.head.x, hy = sk.head.y;
        ctx.fillStyle = flash ? '#ffffff' : '#451a03';
        ctx.beginPath();
        for (let i = 0; i < 24; i++) {
            const a = i / 24 * TAU + Math.sin(globalTimer / 10) * 0.05;
            const r = i % 2 === 0 ? 17 + Math.sin(globalTimer / 6 + i) * 0.8 : 12;
            const px = hx - 3 + Math.cos(a) * r, py = hy + Math.sin(a) * r;
            if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = flash ? '#ffffff' : '#7c2d12'; ctx.beginPath(); ctx.arc(hx - 3, hy - 8, 2.8, 0, TAU); ctx.fill();
        ctx.fillStyle = flash ? '#ffffff' : '#9a3412'; ctx.strokeStyle = '#3a2210'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(hx, hy, 9, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.ellipse(hx + 6, hy + 2, 5, 3.5, 0, 0, TAU); ctx.fill();
        const jaw = clamp(l.jaw, 0, 1);
        if (jaw > 0.15) {
            ctx.fillStyle = '#450a0a';
            ctx.beginPath(); ctx.moveTo(hx + 3, hy + 3); ctx.lineTo(hx + 12, hy + 2); ctx.lineTo(hx + 10, hy + 3 + jaw * 7); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.moveTo(hx + 8.5, hy + 2.6); ctx.lineTo(hx + 9.5, hy + 5); ctx.lineTo(hx + 10.5, hy + 2.4); ctx.fill();
            ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(hx + 2, hy + 5); ctx.lineTo(hx + 10, hy + 3 + jaw * 7); ctx.stroke();
        }
        ctx.fillStyle = '#1c1917'; ctx.beginPath(); ctx.arc(hx + 11, hy + 1, 1.8, 0, TAU); ctx.fill();
        if (l.state === 'dead') {
            ctx.strokeStyle = '#1c1917'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(hx + 1.5, hy - 4.5); ctx.lineTo(hx + 4.5, hy - 1.5); ctx.moveTo(hx + 4.5, hy - 4.5); ctx.lineTo(hx + 1.5, hy - 1.5); ctx.stroke();
        } else {
            ctx.fillStyle = l.state === 'crouch' ? '#ef4444' : '#fbbf24';
            ctx.beginPath(); ctx.arc(hx + 3, hy - 3, 1.8, 0, TAU); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hx + 3.6, hy - 3, 0.8, 0, TAU); ctx.fill();
            ctx.strokeStyle = '#1c1917'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(hx, hy - 6.5); ctx.lineTo(hx + 6, hy - 4.5); ctx.stroke();
        }
        ctx.restore();
        if (l.state === 'crouch') {   // telegraph the pounce
            ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6 + Math.sin(globalTimer) * 0.3;
            ctx.drawImage(glowSprite('#ef4444'), cx + l.direction * 30 - 10, cy - 18, 20, 20); ctx.restore();
        }
        if (l.state !== 'dead') {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(cx - 15, l.y - 16, 30, 4);
            ctx.fillStyle = '#22c55e'; ctx.fillRect(cx - 15, l.y - 16, 30 * clamp(l.health / l.maxHealth, 0, 1), 4);
        }
    }

    function drawTree() { platforms.forEach(p=>{if(p.isTree){ctx.fillStyle='#3e2723';ctx.fillRect(p.x,p.y,p.width,580-p.y);ctx.fillStyle='#15803d';ctx.beginPath();ctx.arc(p.x+p.width/2,p.y,p.width/1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(p.x+p.width/2-5,p.y-5,p.width/2,0,Math.PI*2);ctx.fill();}})}

    function drawUI() {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(8, 8, 154, 19);

    function drawDetailedSkeleton(cx, cy, alpha, aura) {

            grad.addColorStop(0, `rgba(0, 255, 255, ${aura * 0.6})`); grad.addColorStop(1, 'rgba(0, 255, 255, 0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, 80, 0, Math.PI * 2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(cx, cy - 20, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'black'; ctx.beginPath();
        ctx.arc(cx - 4, cy - 22, 3, 0, Math.PI * 2); ctx.arc(cx + 4, cy - 22, 3, 0, Math.PI * 2); ctx.fill();

    function drawGiantAnt(ant) {
        const s = ant.scale, x = ant.x, y = ant.y;
        ctx.save(); ctx.fillStyle = '#0f0f0f'; ctx.strokeStyle = '#0f0f0f'; ctx.lineWidth = 3 * s; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.ellipse(x + 15*s, y, 12*s, 8*s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x, y, 8*s, 6*s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x - 10*s, y - 2*s, 6*s, 5*s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x - 15*s, y - 1*s); ctx.lineTo(x - 20*s, y + 2*s);
        ctx.moveTo(x - 15*s, y + 1*s); ctx.lineTo(x - 20*s, y + 4*s); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 14*s, y - 6*s); ctx.lineTo(x - 22*s, y - 12*s);
        ctx.moveTo(x - 12*s, y - 6*s); ctx.lineTo(x - 18*s, y - 14*s); ctx.stroke();
        const w = ant.walkCycle;
        ctx.beginPath();
        ctx.moveTo(x - 2*s, y - 2*s); ctx.lineTo(x - 10*s, y - 10*s + Math.sin(w)*4*s); ctx.lineTo(x - 15*s, y - 20*s + Math.sin(w)*4*s);
        ctx.moveTo(x + 2*s, y); ctx.lineTo(x + 5*s, y - 12*s + Math.sin(w + Math.PI)*4*s); ctx.lineTo(x + 8*s, y - 22*s + Math.sin(w + Math.PI)*4*s);
        ctx.moveTo(x + 8*s, y + 2*s); ctx.lineTo(x + 15*s, y - 8*s + Math.sin(w + Math.PI/2)*4*s); ctx.lineTo(x + 22*s, y - 18*s + Math.sin(w + Math.PI/2)*4*s);

    function addImpact(x, y, o = {}) { fxImpacts.push({ x, y, life: o.life || 8, max: o.life || 8, dir: o.dir || 0, big: !!o.big, block: !!o.block, seed: Math.random() * TAU }); }

    function drawImpacts() {
        if (!fxImpacts.length) return;
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
        for (const f of fxImpacts) {
            const k = f.life / f.max, r = (f.big ? 36 : 24) * (1.25 - k);
            ctx.globalAlpha = k; ctx.strokeStyle = f.block ? '#93c5fd' : '#fff7d6'; ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = i / 8 * TAU + f.seed, r0 = r * 0.35, r1 = r * (i % 2 ? 0.8 : 1.25);
                ctx.moveTo(f.x + Math.cos(a) * r0, f.y + Math.sin(a) * r0); ctx.lineTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1);
            }
            ctx.stroke();
            if (f.dir) {   // the cut across the target
                ctx.lineWidth = 3 * k + 0.5;
                ctx.beginPath(); ctx.moveTo(f.x - f.dir * 26, f.y - 12); ctx.lineTo(f.x + f.dir * 26, f.y + 12); ctx.stroke();
            }
            if (k > 0.6) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(f.x, f.y, (f.big ? 9 : 6) * k, 0, TAU); ctx.fill(); }
        }
        ctx.restore();
    }

    function drawTexts() {
        if (!fxTexts.length) return;
        ctx.save(); ctx.textAlign = 'center'; ctx.font = 'bold 14px "Courier New"';
        for (const t of fxTexts) {
            ctx.globalAlpha = Math.min(1, t.life / 15);
            ctx.fillStyle = '#000'; ctx.fillText(t.text, t.x + 1, t.y + 1);
            ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
        }
        ctx.restore();
    }

    function drawOverlayFX() {
        if (currentLevel === 9) drawLevel9HUD();

        if (player && player.comboCount >= 2 && player.comboShow > 0) {

            ctx.fillStyle = (globalTimer >> 3) % 2 ? '#fde68a' : '#f87171'; ctx.fillText('MASH!', x, y);
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 25, y + 5, 50, 5);

    function drawAll() {
        ctx.save(); ctx.scale(scale, scale);
        if (currentLevel === 9) drawHellSky();
        else {
            let grad = ctx.createLinearGradient(0, 0, 0, gameHeight);
            grad.addColorStop(0, '#0a0608'); grad.addColorStop(0.5, '#1a0a0d'); grad.addColorStop(1, '#0f172a');

            ctx.strokeStyle = `rgba(255, 255, 255, ${s.opacity})`; ctx.lineWidth = 3;

        });

        ctx.restore();

    // --- HELPER FUNCTIONS ---
    function findClosestEnemy(from) { let closest=null, closestDist=Infinity; enemies.forEach(e => { const d = Math.hypot(e.x-from.x, e.y-from.y); if(d < closestDist) { closestDist = d; closest = e; } }); return closest; }

    // --- COMBAT ---
    const overlap = (a, b) => a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;

    function startSlash(c, stage) {
        c.isSlashing = true; c.comboStage = stage;
        c.slashDur = stage === 3 ? 30 : 22; c.slashCooldown = c.slashDur;
        c.hitList = []; c.slashBuffer = 0; c.justHit = false;
        if (c.onGround) c.vx += c.direction * (stage === 3 ? 4 : 2);   // small lunge
        if (stage === 3) SFX.whoosh(); else SFX.swoosh();
        if (c === player && (currentLevel === 3 || currentLevel === 4) && c.isPoweredUp) bulletRing(c);
    }
    // Slash 1 → 2 → 3: pressing again during a slash (or right after it) continues the combo.
    function slash(c) {
        if (c.isSlashing) { c.slashBuffer = 10; return; }
        if (c.slashCooldown > 0) return;
        startSlash(c, c.comboTimer > 0 && c.comboStage > 0 && c.comboStage < 3 ? c.comboStage + 1 : 1);
    }
    function slashActive(c) { const p = 1 - c.slashCooldown / c.slashDur; return c.isSlashing && p >= 0.22 && p <= 0.62; }
    function spinSlash(character) {
        if (character.spinCooldown <= 0) {
            character.isSpinning = true; character.spinCooldown = 40; character.spinHits = new Map();
            SFX.swoosh();
        }
    }
    function dashSlash(character) {
        if (character.dashCooldown <= 0) {
            character.isDashing = true; character.dashCooldown = 30; character.hitList = [];
            character.vx = 15 * character.direction;
            SFX.whoosh();
        }
    }

    function shoot(shooter, angle = null) {
        const gunTipX=shooter.x+shooter.width/2+(CHARACTER_WIDTH/2+15)*shooter.direction;const gunTipY=shooter.y+25;
        const isPlayerShooting=shooter===player;
        let vx=10*shooter.direction,vy=0;
        if(angle!==null){vx=Math.cos(angle)*10;vy=Math.sin(angle)*10}
        bullets.push({x:gunTipX,y:gunTipY,vx:vx,vy:vy,owner:shooter,damage:BULLET_DAMAGE,isPowerShot:isPlayerShooting&&shooter.isPoweredUp});
    }

    // Powered slash on levels 3 and 4: bullets fly left, right, up and down.
    function bulletRing(c) {
        const x = c.x + c.width / 2, y = c.y + 25;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, -1], [0, 1]]) {
            bullets.push({ x: x + dx * 14, y: y + dy * 18, vx: dx * 10, vy: dy * 10, owner: c, damage: BULLET_DAMAGE, isPowerShot: true });
        }
        spawnSparks(x, y, 10, '#00ffff');
        SFX.shoot();
    }

    // Where a blade touches a target's box, or null.
    function bladeHits(c, t, padX = 12) {
        const L = t.x - padX, R = t.x + t.width + padX, T = t.y - 6, B = t.y + t.height + 6;
        for (const [h, tip] of [[c.handR, c.tipR], [c.handL, c.tipL]]) {
            for (let k = 0.35; k <= 1.001; k += 0.325) {
                const px = h.x + (tip.x - h.x) * k, py = h.y + (tip.y - h.y) * k;
                if (px > L && px < R && py > T && py < B) return { x: px, y: py };
            }
        }
        return null;
    }

    function damageTarget(attacker, target, dmg, o = {}) {
        const tx = target.x + target.width / 2, ty = target.y + target.height / 2;
        const dir = o.dir ?? (attacker ? (Math.sign(tx - (attacker.x + attacker.width / 2)) || attacker.direction || 1) : 1);
        if (target.isDevil) {                                      // devil soul (level 9)
            if (!devilAlive()) return false;
            devilHurt(target, dmg, dir, false);
        } else if ('gait' in target) {                             // lion
            if (target.health <= 0) return false;
            lionHurt(target, dmg, dir, !!o.knockdown);
        } else if ('baseY' in target) {                            // helicopter
            if (target.isFalling) return false;
            target.health -= dmg;
            if (target.health <= 0) { target.health = 1; target.isFalling = true; target.vx = dir * 2; }
        } else {                                                   // stickman
            if (target.health <= 0) return false;
            if (target.isPlayer && (target.hurtTimer > 0 || target.invulnerable)) return false;
            if (target.kd && target.kd.phase !== 'air') return false;
            // Tough enemies sometimes block a hit they can see coming
            if (!target.isPlayer && target.type === 'tough' && !o.unblockable && !target.kd && target.hitstun <= 0 && !target.isSlashing
                && target.windup <= 0 && target.direction === -dir && Math.random() < 0.28) {
                target.blockTimer = 16; target.vx = dir * 3;
                if (attacker) attacker.vx = -dir * 4;
                spawnSparks(tx - dir * 8, ty - 6, 18, '#ffffff');
                addImpact(tx - dir * 8, ty - 6, { block: true, life: 6 });
                SFX.block(); hitStop(5); shake(3); addText(tx, target.y - 16, 'BLOCK', '#93c5fd');
                return 'blocked';
            }
            target.health -= dmg; target.hitFlash = 6;
            target.isSlashing = false; target.windup = 0; target.isSpinning = false; target.isDashing = false; target.blockTimer = 0;
            target.swordTrailR.length = 0; target.swordTrailL.length = 0;
            attackTokens.delete(target.id);
            if (target.isPlayer) target.hurtTimer = PLAYER_HURT_IFRAMES;
            target.direction = -dir;
            if (o.knockdown || target.health <= 0 || (target.kd && target.kd.phase === 'air')) {
                target.kd = { phase: 'air', t: 0, bounced: false }; target.hitstun = 0;
                target.vx = o.kx ?? dir * KNOCKBACK_X; target.vy = -(o.ky ?? KNOCKBACK_Y * 1.3); target.onGround = false;
                target.spinRot = target.renderRot; target.spinDir = dir;
            } else {
                target.hitstun = 16; target.vx = (o.kx ?? dir * KNOCKBACK_X) * 0.45; target.vy = Math.min(target.vy, -2.5); target.onGround = false;
            }
        }
        const big = dmg >= 35 || !!o.knockdown;
        const hx = o.hx ?? tx, hy = o.hy ?? ty;
        spawnSparks(hx, hy, big ? 26 : 16, attacker && attacker.isPoweredUp ? '#00ffff' : '#ffd966');
        spawnBlood(tx, ty, big ? 18 : 10, dir > 0 ? 0 : Math.PI);
        fxShockwaves.push({ x: tx, y: ty, radius: 10, maxRadius: big ? 70 : 50, opacity: 1 });
        addImpact(hx, hy, { dir: o.quiet ? 0 : dir, big });
        shake(big ? 10 : 6);
        hitStop(target.health <= 0 ? 10 : big ? 7 : 4);
        if (!o.quiet) SFX.clash();
        if (big) SFX.heavy(); else SFX.hit();
        addText(tx + rand(-6, 6), target.y - 14, String(Math.round(dmg)), attacker === player ? '#fde68a' : '#f87171');
        if (attacker === player) { player.comboCount = (player.comboShow > 0 ? player.comboCount : 0) + 1; player.comboShow = 90; }
        if (target.health <= 0 && attacker === player && !target.isDevil) lastPlayerKill = { frame: simFrame, id: target.id };

        else newHeight = newWidth / aspectRatio;

        function centreOf(snap, id) {

        }

        api.layout = () => {
            if (!overlay) return;

            const hero = frames[killIdx].e.find(e => e.k === 0 && e.c !== 1);

            renderer.setViewport(0, BAND_Y, gameWidth, BAND_H); renderer.setScissor(0, BAND_Y, gameWidth, BAND_H);

            lionRigs.forEach(r => r.g.visible = false);
            devilRigs.forEach(r => r.g.visible = false);
            sparkLife.fill(0);

    // --- MAIN LOOP: game logic at a fixed 60 steps per second (also on 90/120 Hz screens) ---
    function gameStep() {
        if (hitStopFrames > 0) { hitStopFrames--; return; }          // impact freeze
        if (slowMo > 0) {
            slowMo--;
            if (slowMo % 3 !== 0) { if (slowMo === 0 && levelEnding) finishLevelEnding(); return; }
        }
        simFrame++;
        handleInput(); updateCharacter(player); animateCharacter(player);
        enemies.forEach(e => { updateEnemyAI(e); updateCharacter(e); animateCharacter(e); });
        updateCorpses();
        updateHelicopters(); updateLions(); updateProjectiles(); updateGrapplingRope(); updatePowerUps(); handleCollisions(); updateFX(); checkGameState();
        if (currentLevel === 7) checkBumpCollision();
        if (currentLevel === 9) updateLevel9();
        if (currentLevel === 4 || currentLevel === 6) updateTouchControls();
        recordSnapshot();
        justPressed = {};
        if (levelEnding && slowMo === 0) finishLevelEnding();
        // Kill-cam: shortly after each kill (the final kill of a level gets the longer replay instead)
        else if (lastPlayerKill && !levelEnding && !gameOver && lastPlayerKill.frame > replayedUpTo && simFrame - lastPlayerKill.frame >= 24 && !Replay3D.active && Replay3D.available()) {
            replayedUpTo = simFrame;
            Replay3D.play(replayBuffer, lastPlayerKill, () => {}, true);
        }
    }

    function update() {
        globalTimer++;
        if (godModeVictoryActive) {
            godModeVictoryTimer++;
            if (godModeVictoryTimer >= 180 && godModeVictoryTimer < 480) freezeVictoryAnimation = false;
            else if (godModeVictoryTimer >= 480 && godModeVictoryTimer < 600) freezeVictoryAnimation = true;
            else if (godModeVictoryTimer >= 600) { godModeVictoryActive = false; startNextLevel(); }   // on to the Soul Duel
        } else if (isPlayerBeingEaten) {
            updateAnts(); deathSequenceTimer--; updateFX();
            if(deathSequenceTimer > DEATH_SEQUENCE_DURATION - 240 && deathSequenceTimer % 10 === 0) spawnBlood(playerDeathPos.x + Math.random() * CHARACTER_WIDTH, playerDeathPos.y + Math.random() * CHARACTER_HEIGHT, 1, 0);
            if (deathSequenceTimer <= 0) { isPlayerBeingEaten = false; startNextLevel(); }
        } else if (levelTransitioning || gameOver) {
            // Pause state
        } else if (currentLevel === 8) {
            updateBossBattle(); updateBossEffects(); updateTouchControls();
        } else {
            gameStep();
            return;
        }
        justPressed = {};
        if (gameOver && keys['KeyR']) { gameOver = false; startLevel(1, true); }
    }

    function drawGameOverOverlay() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f8fafc'; ctx.textAlign = 'center';
        ctx.font = '60px "Courier New"'; ctx.fillText(gameWon ? 'VICTORY!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '30px "Courier New"'; ctx.fillText(gameOverMessage, canvas.width / 2, canvas.height / 2 + 20);
        ctx.font = '20px "Courier New"'; ctx.fillStyle = '#94a3b8'; ctx.fillText('Tap or Press R to Restart', canvas.width / 2, canvas.height / 2 + 60);
    }

    function render() {
        if (godModeVictoryActive) {
            if (godModeVictoryTimer < 180) {
                drawBossBattle();
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.font='60px "Courier New"'; ctx.fillStyle='#22d3ee'; ctx.textAlign='center'; ctx.fillText('GOD MODE: VICTORY!', canvas.width/2, canvas.height/2);
            } else if (godModeVictoryTimer < 480) { drawGodVictory(); }
            else if (godModeVictoryTimer < 600) {
                drawGodVictory();
                let opacity = (godModeVictoryTimer - 480) / 120;
                ctx.fillStyle = `rgba(0,0,0,${opacity})`; ctx.fillRect(0,0,canvas.width,canvas.height);
                if (opacity > 0.5) { ctx.font='100px "Courier New"'; ctx.fillStyle='#f8fafc'; ctx.textAlign='center'; ctx.fillText('Peace', canvas.width/2, canvas.height/2); }
            } else {
                ctx.fillStyle='black'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.font='100px "Courier New"'; ctx.fillStyle='#f8fafc'; ctx.textAlign='center'; ctx.fillText('Peace', canvas.width/2, canvas.height/2);
                ctx.font='20px "Courier New"'; ctx.fillText('Tap or Press R to Restart', canvas.width/2, canvas.height/2+80);
            }
        } else if (currentLevel === 8) {
            if (!levelTransitioning) { drawBossBattle(); if (gameOver) drawGameOverOverlay(); }
            else {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f8fafc'; ctx.textAlign = 'center';
                ctx.font = '40px "Courier New"'; ctx.fillText(`LEVEL 7 COMPLETE!`, canvas.width / 2, canvas.height / 2);
                ctx.font = '25px "Courier New"'; ctx.fillText(`Get ready for Level 8...`, canvas.width / 2, canvas.height / 2 + 40);
            }
        } else { drawAll(); drawUI(); }
    }

    let lastTime = 0, accumulator = 0;
    function frame(now) {
        if (!lastTime) lastTime = now;
        const elapsed = Math.min(100, now - lastTime);
        lastTime = now;
        if (Replay3D.liveActive) {
            if (!Replay3D.renderLive(elapsed)) render();       // the game is paused while the lion cam shows
        } else if (Replay3D.active) {
            Replay3D.render(elapsed);
        } else {
            accumulator += elapsed;
            let steps = 0;
            while (accumulator >= STEP_MS && steps < 5 && !Replay3D.active) { update(); accumulator -= STEP_MS; steps++; }
            if (steps === 5) accumulator = 0;
            if (!(Replay3D.liveActive && Replay3D.renderLive(0))) render();
        }
        requestAnimationFrame(frame);
    }

    // --- FULLSCREEN LOGIC ---
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (gameContainer.requestFullscreen) gameContainer.requestFullscreen();
            else if (gameContainer.webkitRequestFullscreen) gameContainer.webkitRequestFullscreen();
            else if (gameContainer.msRequestFullscreen) gameContainer.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    });
    document.addEventListener('fullscreenchange', resizeCanvas);
    document.addEventListener('webkitfullscreenchange', resizeCanvas);

    // --- INITIALIZE AND START ---
    // Test hooks in the URL hash: #level=6 starts on a level, #bot plays by itself, #three loads three.js at once.
    setupInput();
    startLevel(clamp(parseInt(HASH.get('level')) || 1, 1, 9), true);
    if (HASH.has('three')) Replay3D.load();
    window.addEventListener('resize', resizeCanvas, false);
    resizeCanvas();
    updateTouchControls();
    requestAnimationFrame(frame);
</script>
</body>
</html>
