            while (lastEvent < i) {
                lastEvent++;
                for (const ev of frames[lastEvent].h) burst(X(ev.x), Y(ev.y), 0, ev.big ? 26 : 14, ev.big);
                if (lastEvent === killIdx) { flash = 1; burst(X(focus.x), Y(focus.y), 0, 30, true); }
            }
            apply(frames[i], frames[i + 1], t);
            stepSparks(dt);

            const u = cursor / (frames.length - 1);
            const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
            const ang = lerp(-0.95, 0.85, e);
            const r = lerp(17, 10.5, Math.min(1, u * 1.6)) + (u > 0.75 ? (u - 0.75) * 10 : 0);
            const fx = X(focus.x), fy = Y(focus.y);
            const shakeAmt = flash * 0.25;
            camera.position.set(fx + Math.sin(ang) * r + (Math.random() - 0.5) * shakeAmt, fy + 1.1 + (1 - u) * 2.2, Math.cos(ang) * r);
            camera.lookAt(fx, fy + 0.6, 0);
            scene.background.setRGB(bg.r + flash * 0.5, bg.g + flash * 0.45, bg.b + flash * 0.4);
            flash = Math.max(0, flash - 0.04 * dt);

            drawScene();
            label.textContent = (short ? '◉ KILL CAM' : '◉ REPLAY') + (d < 12 ? '  ×0.2' : '') + '   tap to skip';
        };

        // Lion cam: the game pauses on the lion's big moment and the camera circles the frozen scene
        // for a few seconds (bullet time), then the game carries on from exactly there. Tap to skip.
        let liveMs = 0, liveTotal = 1, liveId = 0, liveText = '', liveT = 0, liveF = 0, liveFocus = null;
        api.liveActive = false; api.liveEndedAt = -9999;
        api.blocking = () => api.active;
        let liveTag = 'LION CAM';
        api.live = (id, ms, text, tag = 'LION CAM') => {
            if (api.blocking() || !api.available() || !init()) return false;
            UP = UP || new T.Vector3(0, 1, 0); V1 = V1 || new T.Vector3();
            liveText = text; liveId = id; liveTag = tag;
            if (api.liveActive) { liveMs = Math.max(liveMs, ms); return true; }
            try { buildLevel(); } catch (e) { return false; }
            resetRigs();
            api.stopArena(); api.stopLeisure(); setAspect(false);
            liveMs = liveTotal = ms; liveT = 0; liveF = simFrame - 1; liveFocus = null; flash = 0.35;
            api.active = true; api.liveActive = true;
            overlay.style.display = 'block'; label.style.display = 'block';
            document.getElementById('touchControls').style.visibility = 'hidden';
            api.layout();
            return true;
        };
        api.stopLive = () => {
            if (!api.liveActive) return;
            api.liveActive = false; api.active = false; api.liveEndedAt = simFrame;
            overlay.style.display = 'none'; label.style.display = 'none';
            document.getElementById('touchControls').style.visibility = '';
        };
        api.renderLive = (ms) => {
            liveMs -= ms;
            const n = replayBuffer.length;
            if (liveMs <= 0 || n < 2 || gameOver || levelTransitioning || levelEnding || (currentLevel !== 6 && currentLevel !== 9)) { api.stopLive(); return false; }
            const dt = Math.min(ms, 50) / (1000 / 60);
            liveT += dt;
            for (let i = Math.max(0, n - 6); i < n; i++) {
                const s = replayBuffer[i];
                if (s.f > liveF) { liveF = s.f; for (const ev of s.h) burst(X(ev.x), Y(ev.y), 0, ev.big ? 26 : 14, ev.big); }
            }
            const B = replayBuffer[n - 1];
            apply(B, B, 0);                                    // frozen moment
            stepSparks(dt);
            applyFX(B);
            const lion = centreOf(B, liveId), hero = centreOf(B, player.id);
            let f = lion || hero || { x: 400, y: 500 };
            if (lion && hero && Math.abs(lion.x - hero.x) < 260) f = { x: (lion.x * 2 + hero.x) / 3, y: (lion.y * 2 + hero.y) / 3 };
            liveFocus = liveFocus ? { x: lerp(liveFocus.x, f.x, 0.08), y: lerp(liveFocus.y, f.y, 0.08) } : f;
            const u = clamp(1 - liveMs / liveTotal, 0, 1), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
            const ang = lerp(-0.9, 0.9, e), r = lerp(12, 9, e);
            const fx = X(liveFocus.x), fy = Y(liveFocus.y);
            camera.position.set(fx + Math.sin(ang) * r, fy + 1.5 - e * 0.5, Math.cos(ang) * r);
            camera.lookAt(fx, fy + 0.5, 0);
            scene.background.setRGB(bg.r + flash * 0.5, bg.g + flash * 0.45, bg.b + flash * 0.4);
            flash = Math.max(0, flash - 0.03 * dt);
            drawScene();
            label.textContent = `◉ ${liveTag} · ${liveText}   HP ${Math.max(0, Math.round(player.health))}   tap to skip`;
            return true;
        };
        // Level 9 arena: the whole fight is drawn in 3D, live, with a camera that follows both fighters.
        // The 2D HUD is drawn on a transparent canvas on top; the buttons stay above both.
        let arenaOn = false, arenaF = 0, punchT = 0, cam = null;
        api.arenaActive = () => arenaOn;
        api.punch = n => { punchT = Math.max(punchT, n); flash = Math.max(flash, 0.25); };
        api.hud = () => hudCtx;
        const PV = { v: null };
        api.project = (x, y) => {
            if (!arenaOn) return { x, y };
            const v = PV.v || (PV.v = new T.Vector3());
            v.set(X(x), Y(y), 0).project(camera);
            return { x: (v.x + 1) / 2 * gameWidth, y: (1 - v.y) / 2 * gameHeight };
        };
        api.renderArena = (ms) => {
            if (!api.available() || !init()) return false;
            const n = replayBuffer.length;
            if (n < 1) return false;
            UP = UP || new T.Vector3(0, 1, 0); V1 = V1 || new T.Vector3();
            if (!arenaOn) {
                try { buildLevel(); } catch (e) { return false; }
                resetRigs(); arenaOn = true; cam = null; arenaF = replayBuffer[n - 1].f;
                overlay.style.zIndex = '5'; overlay.style.pointerEvents = 'none'; overlay.style.display = 'block';
                hudCanvas.style.display = 'block'; label.style.display = 'none';
                api.layout();
            }
            buildLevel(); setAspect(true);
            const dt = Math.min(ms, 50) / (1000 / 60), now = performance.now();
            for (let i = Math.max(0, n - 6); i < n; i++) {
                const s = replayBuffer[i];
                if (s.f > arenaF) { arenaF = s.f; for (const ev of s.h) burst(X(ev.x), Y(ev.y), 0, ev.big ? 26 : 14, ev.big); if (s.fx && s.fx.b.length) flash = Math.max(flash, 0.5); }
            }
            const B = replayBuffer[n - 1];
            apply(B, B, 0); stepSparks(dt); animateArena(now);
            const hero = centreOf(B, player.id) || { x: 400, y: 520 }, dv = B.e.find(e => e.k === 2);
            const devilC = dv ? { x: dv.x, y: dv.y } : null;
            let fx = hero.x, fy = Math.min(hero.y, 540), dist = 12, ang = 0.22;
            if (devilC) {
                fx = (hero.x + devilC.x) / 2; fy = Math.min(540, (hero.y + devilC.y) / 2);
                dist = clamp((Math.abs(hero.x - devilC.x) * S / 2 + 4) / 0.46, 12, 30);
                if (dv.st === 'intro') {                          // entrance: swing round the devil, then pull back
                    const u = clamp(1 - (dv.t || 0) / 150, 0, 1), e = u * u * (3 - 2 * u);
                    fx = lerp(devilC.x, fx, e); fy = lerp(devilC.y - 20, fy, e); dist = lerp(7.5, dist, e); ang = lerp(1.25, 0.22, e);
                }
            }
            if (punchT > 0 && devilC) {
                punchT -= dt; const k = Math.min(1, punchT / 10);
                fx = lerp(fx, devilC.x, 0.6 * k); fy = lerp(fy, devilC.y, 0.6 * k); dist = lerp(dist, Math.max(9, dist * 0.6), k); ang = lerp(ang, 0.5, k);
            }
            const target = { x: X(fx), y: Y(fy), d: dist, a: ang };
            if (!cam) cam = { ...target };
            const sm = dv && dv.st === 'intro' ? 0.12 : 0.07;
            for (const k of ['x', 'y', 'd', 'a']) cam[k] = lerp(cam[k], target[k], 1 - Math.pow(1 - sm, dt));
            const sh = cameraShake * 0.012;
            camera.position.set(cam.x + Math.sin(cam.a) * cam.d + (Math.random() - 0.5) * sh, Math.max(1.2, cam.y + 1.6 + cam.d * 0.08) + (Math.random() - 0.5) * sh, Math.cos(cam.a) * cam.d);
            camera.lookAt(cam.x, cam.y + 0.4, 0);
            scene.background.setRGB(bg.r + flash * 0.6, bg.g + flash * 0.55, bg.b + flash * 0.6);
            hemi.intensity = 0.6 + flash * 1.2;
            flash = Math.max(0, flash - 0.05 * dt);
            drawScene(true);
            return true;
        };
        // Leisure cam: the frozen scene in 3D around the resting hero (cigar close-up, sitting on the edge)
        let leisOn = false, leisF = 0, lcam = null, leisT = 0;
        api.renderLeisure = (ms) => {
            if (!api.available() || !init()) return false;
            const n = replayBuffer.length;
            if (n < 1) return false;
            UP = UP || new T.Vector3(0, 1, 0); V1 = V1 || new T.Vector3();
            if (!leisOn) {
                try { buildLevel(); } catch (e) { return false; }
                resetRigs(); leisOn = true; lcam = null; leisT = 0; flash = 0.3;
                overlay.style.zIndex = '5'; overlay.style.pointerEvents = 'none'; overlay.style.display = 'block';
                label.style.display = 'block'; api.layout();
            }
            buildLevel(); setAspect(true);
            const dt = Math.min(ms, 50) / (1000 / 60);
            leisT += dt;
            const B = replayBuffer[n - 1], me = B.e.find(e => e.id === player.id && e.lz);
            if (!me) return false;
            apply(B, B, 0); stepSparks(dt); animateArena(performance.now());
            const edge = me.lz.k === 'edge', r = rigs.get(me.c === 3 ? 'A' + me.id : me.id), dir = me.d || 1;
            if (floorPlane) floorPlane.position.y = edge ? -9 : -1;
            let target;
            if (edge) {
                const hx = X(me.J[0]), u = clamp(leisT / 300, 0, 1);
                const a = lerp(-0.5, 0.45, u * u * (3 - 2 * u));
                target = { x: hx, y: 0.75, z: me.lz.ez, d: 8 - u * 1.4, a, h: 0.7 };
            } else {
                const hp = r ? r.head.position : { x: X(me.J[2]), y: Y(me.J[3]) + 0.4 };
                const u = clamp(leisT / 320, 0, 1), a = dir * lerp(1.05, 0.45, u) + Math.sin(leisT / 90) * 0.05;
                target = { x: hp.x + dir * 0.35, y: hp.y - 0.55, z: 0, d: lerp(5.6, 4.2, u), a, h: 0.35 };
            }
            if (!lcam) lcam = { ...target };
            for (const k of ['x', 'y', 'z', 'd', 'a', 'h']) lcam[k] = lerp(lcam[k], target[k], 1 - Math.pow(0.92, dt));
            camera.position.set(lcam.x + Math.sin(lcam.a) * lcam.d, lcam.y + lcam.h + lcam.d * 0.12, lcam.z + Math.cos(lcam.a) * lcam.d);
            camera.lookAt(lcam.x, lcam.y, lcam.z);
            scene.background.setRGB(bg.r + flash * 0.4, bg.g + flash * 0.35, bg.b + flash * 0.3);
            flash = Math.max(0, flash - 0.03 * dt);
            drawScene(true);
            label.textContent = `◉ LEISURE CAM · ${edge ? 'ON THE EDGE' : 'CIGAR BREAK'}   L / Leisure to fight`;
            return true;
        };
        api.stopLeisure = () => {
            if (!leisOn) return;
            leisOn = false;
            if (floorPlane) floorPlane.position.y = -1;
            overlay.style.display = 'none'; overlay.style.zIndex = '150'; overlay.style.pointerEvents = 'auto';
            label.style.display = 'none';
        };
        api.stopArena = () => {
            if (!arenaOn) return;
            arenaOn = false; punchT = 0;
            overlay.style.display = 'none'; overlay.style.zIndex = '150'; overlay.style.pointerEvents = 'auto';
            hudCanvas.style.display = 'none';
        };
        return api;
    })();

    // --- MAIN LOOP: game logic at a fixed 60 steps per second (also on 90/120 Hz screens) ---
    function gameStep() {
        if (hitStopFrames > 0) { hitStopFrames--; return; }          // impact freeze
        if (slowMo > 0) {
            slowMo--;
            if (slowMo % 3 !== 0) { if (slowMo === 0 && levelEnding) finishLevelEnding(); return; }
        }
        simFrame++;
        handleInput(); updateCharacter(player); animateCharacter(player);
        enemies.forEach(e => { updateEnemyAI(e); updateCharacter(e); animateCharacter(e); });
        updateCorpses();
        updateHelicopters(); updateLions(); updateProjectiles(); updateGrapplingRope(); updatePowerUps(); handleCollisions(); updateFX(); checkGameState();
        if (currentLevel === 7) checkBumpCollision();
        if (currentLevel === 9) updateLevel9();
        if (currentLevel === 4 || currentLevel === 6) updateTouchControls();
        recordSnapshot();
        justPressed = {};
        if (levelEnding && slowMo === 0) finishLevelEnding();
        // Kill-cam: shortly after each kill (the final kill of a level gets the longer replay instead)
        else if (lastPlayerKill && !levelEnding && !gameOver && lastPlayerKill.frame > replayedUpTo && simFrame - lastPlayerKill.frame >= 24 && !Replay3D.active && Replay3D.available()) {
            replayedUpTo = simFrame;
            Replay3D.play(replayBuffer, lastPlayerKill, () => {}, true);
        }
    }

    function update() {
        globalTimer++;
        if (godModeVictoryActive) {
            godModeVictoryTimer++;
            if (godModeVictoryTimer >= 180 && godModeVictoryTimer < 480) freezeVictoryAnimation = false;
            else if (godModeVictoryTimer >= 480 && godModeVictoryTimer < 600) freezeVictoryAnimation = true;
            else if (godModeVictoryTimer >= 600) { godModeVictoryActive = false; startNextLevel(); }   // on to the Soul Duel
        } else if (isPlayerBeingEaten) {
            updateAnts(); deathSequenceTimer--; updateFX();
            if(deathSequenceTimer > DEATH_SEQUENCE_DURATION - 240 && deathSequenceTimer % 10 === 0) spawnBlood(playerDeathPos.x + Math.random() * CHARACTER_WIDTH, playerDeathPos.y + Math.random() * CHARACTER_HEIGHT, 1, 0);
            if (deathSequenceTimer <= 0) { isPlayerBeingEaten = false; startNextLevel(); }
        } else if (levelTransitioning || gameOver) {
            // Pause state
        } else if (currentLevel === 8) {
            updateBossBattle(); updateBossEffects(); updateTouchControls();
        } else {
            if (player && player.leisure) leisureStep(); else gameStep();
            return;
        }
        justPressed = {};
        if (gameOver && keys['KeyR']) { gameOver = false; startLevel(1, true); }
    }

    function drawGameOverOverlay() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f8fafc'; ctx.textAlign = 'center';
        ctx.font = '60px "Courier New"'; ctx.fillText(gameWon ? 'VICTORY!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '30px "Courier New"'; ctx.fillText(gameOverMessage, canvas.width / 2, canvas.height / 2 + 20);
        ctx.font = '20px "Courier New"'; ctx.fillStyle = '#94a3b8'; ctx.fillText('Tap or Press R to Restart', canvas.width / 2, canvas.height / 2 + 60);
    }

    function render() {
        if (godModeVictoryActive) {
            if (godModeVictoryTimer < 180) {
                drawBossBattle();
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.font='60px "Courier New"'; ctx.fillStyle='#22d3ee'; ctx.textAlign='center'; ctx.fillText('GOD MODE: VICTORY!', canvas.width/2, canvas.height/2);
            } else if (godModeVictoryTimer < 480) { drawGodVictory(); }
            else if (godModeVictoryTimer < 600) {
                drawGodVictory();
                let opacity = (godModeVictoryTimer - 480) / 120;
                ctx.fillStyle = `rgba(0,0,0,${opacity})`; ctx.fillRect(0,0,canvas.width,canvas.height);
                if (opacity > 0.5) { ctx.font='100px "Courier New"'; ctx.fillStyle='#f8fafc'; ctx.textAlign='center'; ctx.fillText('Peace', canvas.width/2, canvas.height/2); }
            } else {
                ctx.fillStyle='black'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.font='100px "Courier New"'; ctx.fillStyle='#f8fafc'; ctx.textAlign='center'; ctx.fillText('Peace', canvas.width/2, canvas.height/2);
                ctx.font='20px "Courier New"'; ctx.fillText('Tap or Press R to Restart', canvas.width/2, canvas.height/2+80);
            }
        } else if (currentLevel === 8) {
            if (!levelTransitioning) { drawBossBattle(); if (gameOver) drawGameOverOverlay(); }
            else {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f8fafc'; ctx.textAlign = 'center';
                ctx.font = '40px "Courier New"'; ctx.fillText(`LEVEL 7 COMPLETE!`, canvas.width / 2, canvas.height / 2);
                ctx.font = '25px "Courier New"'; ctx.fillText(`Get ready for Level 8...`, canvas.width / 2, canvas.height / 2 + 40);
            }
        } else { drawAll(); drawUI(); }
    }

    let lastTime = 0, accumulator = 0;
    function frame(now) {
        if (!lastTime) lastTime = now;
        const elapsed = Math.min(100, now - lastTime);
        lastTime = now;
        if (Replay3D.liveActive) {
            if (!Replay3D.renderLive(elapsed)) render();       // the game is paused while the lion cam shows
        } else if (Replay3D.active) {
            Replay3D.render(elapsed);
        } else {
            accumulator += elapsed;
            let steps = 0;
            while (accumulator >= STEP_MS && steps < 5 && !Replay3D.active) { update(); accumulator -= STEP_MS; steps++; }
            if (steps === 5) accumulator = 0;
            if (Replay3D.liveActive && Replay3D.renderLive(0)) { /* lion cam */ }
            else if (player && player.leisure && leisureIn3D() && !Replay3D.active && Replay3D.renderLeisure(elapsed)) { Replay3D.stopArena(); }
            else if (currentLevel === 9 && !levelTransitioning && !Replay3D.active && Replay3D.renderArena(elapsed)) { Replay3D.stopLeisure(); drawArenaHUD(); }
            else { Replay3D.stopArena(); Replay3D.stopLeisure(); render(); }
        }
        requestAnimationFrame(frame);
    }

    // --- FULLSCREEN LOGIC ---
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (gameContainer.requestFullscreen) gameContainer.requestFullscreen();
            else if (gameContainer.webkitRequestFullscreen) gameContainer.webkitRequestFullscreen();
            else if (gameContainer.msRequestFullscreen) gameContainer.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    });
    document.addEventListener('fullscreenchange', resizeCanvas);
    document.addEventListener('webkitfullscreenchange', resizeCanvas);

    // --- INITIALIZE AND START ---
    // Test hooks in the URL hash: #level=6 starts on a level, #bot plays by itself, #three loads three.js at once.
    setupInput();
    startLevel(clamp(parseInt(HASH.get('level')) || 1, 1, 9), true);
    if (HASH.has('three')) Replay3D.load();
    window.addEventListener('resize', resizeCanvas, false);
    resizeCanvas();
    updateTouchControls();
    requestAnimationFrame(frame);
</script>
</body>
